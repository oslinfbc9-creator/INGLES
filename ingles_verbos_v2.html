<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inglés: Frases habladas + Verbos</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f4f7fb; color: #222; }
  .container { max-width: 960px; margin: 20px auto; padding: 0 16px; }
  h1 { font-size: 20px; text-align: center; margin-bottom: 24px; color: #1a3a6e; }
  .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .section-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: #1a3a6e; display: flex; align-items: center; gap: 8px; }
  input, select, button { font-size: 15px; padding: 10px 14px; border: 1px solid #c9d4e6; border-radius: 8px; width: 100%; margin-bottom: 12px; background: #fff; }
  button { cursor: pointer; background: #1a3a6e; color: #fff; border: none; font-weight: 600; }
  button:hover { background: #15315c; }
  button.secondary { background: #6c757d; width: auto; padding: 10px 18px; border-radius: 8px; font-weight: 600; transition: all 0.2s ease; border: none; cursor: pointer; font-size: 14px; }
  button.secondary:hover { background: #5a6268; transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
  button.secondary:active { transform: translateY(0); }

  /* Estilos para botones de acción principal */
  button[onclick*="enviarAGemini"] { background: #1a3a6e; color: #fff; padding: 12px 24px; font-size: 15px; }
  button[onclick*="enviarAGemini"]:hover { background: #15315c; }

  /* Estilos para botón añadir biblioteca */
  button[onclick*="anadirConIA"] { background: #2d5a27; color: #fff; padding: 12px 24px; font-size: 15px; }
  button[onclick*="anadirConIA"]:hover { background: #244a1e; }

  /* Estilos para botón limpiar */
  button[onclick*="limpiarIA"] { background: #6c757d; color: #fff; padding: 12px 24px; font-size: 15px; }
  button[onclick*="limpiarIA"]:hover { background: #5a6268; }

  /* Estilos para botón escuchar respuesta */
  button[onclick*="hablarFraseIA"] { background: #4a5568; color: #fff; padding: 12px 24px; font-size: 15px; width: 100%; margin-top: 10px; }
  button[onclick*="hablarFraseIA"]:hover { background: #3d4752; }

  /* Estilos para checkboxes con label */
  .checkbox-group { display: flex; align-items: center; gap: 10px; margin: 12px 0; padding: 10px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; }
  .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #1a3a6e; }
  .checkbox-group label { cursor: pointer; font-size: 14px; color: #334155; line-height: 1.4; user-select: none; }
  .btn-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .btn-row button { flex: 1; }
  .result { margin-top: 14px; padding: 14px; background: #eef3fb; border-radius: 10px; min-height: 60px; display: none; }
  .result h3 { margin: 0 0 8px 0; font-size: 16px; color: #1a3a6e; }
  .result p { margin: 4px 0; font-size: 15px; line-height: 1.5; }
  .example { font-style: italic; color: #444; margin-top: 8px; padding-left: 10px; border-left: 3px solid #1a3a6e; }
  .traduccion { color: #2e7d32; font-weight: 600; margin-top: 6px; }
  .tag { display: inline-block; background: #dce8f7; color: #1a3a6e; padding: 2px 8px; border-radius: 12px; font-size: 12px; margin-right: 6px; margin-bottom: 6px; }
  .muted { color: #666; font-size: 13px; text-align: center; margin-top: 10px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 500px){ .grid-2 { grid-template-columns: 1fr; } }

  /* Estilos para ejemplos por conjugacion */
  .example-block { margin-top: 10px; padding: 10px; background: #fafafa; border-radius: 8px; border: 1px solid #e0e0e0; }
  .example-label { font-size: 12px; font-weight: 700; color: #1a3a6e; margin: 6px 0 3px 0; text-transform: uppercase; letter-spacing: 0.5px; }
  .example-line { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 14px; }
  .example-line .en { color: #1a3a6e; font-weight: 600; }
  .example-line .es { color: #666; font-size: 12px; }
  .btn-small { padding: 4px 10px; font-size: 12px; }

  /* Layout con sidebar */
  .layout { display: flex; gap: 20px; margin-top: 10px; }
  .sidebar { width: 260px; flex-shrink: 0; }
  .contenido-principal { flex: 1; }
  .palabras-lista { max-height: 500px; overflow-y: auto; border: 1px solid #c9d4e6; border-radius: 8px; padding: 10px; background: #fff; }
  .palabra-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 6px; border-bottom: 1px solid #eee; cursor: pointer; border-radius: 6px; margin-bottom: 4px; }
  .palabra-item:hover { background: #f0f4fb; }
  .palabra-item:last-child { border-bottom: none; }
  .palabra-nombre { font-weight: 600; color: #1a3a6e; font-size: 14px; }
  .palabra-trad { font-size: 12px; color: #666; }
  .palabra-escuchar { background: none; border: 1px solid #1a3a6e; color: #1a3a6e; padding: 3px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
  .palabra-escuchar:hover { background: #1a3a6e; color: #fff; }

  /* Estilos sección IA */
  #prompt-ia { width: 100%; font-family: inherit; resize: vertical; }
  #respuesta-ia { white-space: pre-wrap; }

  @media (max-width: 700px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>🎙️ Inglés: Frases habladas + Buscador de verbos</h1>

  <div class="layout">
    <div class="sidebar">
      <div class="section-title">📚 Biblioteca de estudio</div>
      <div class="stats-barras" style="margin-bottom:10px;padding:8px;background:#eef3fb;border-radius:8px;font-size:13px;color:#1a3a6e;">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;">
          <div><strong>Total:</strong> <span id="stat-total">0</span></div>
          <div><strong>Nuevas:</strong> <span id="stat-nuevas">0</span></div>
          <div><strong>Aprendidas:</strong> <span id="stat-aprendidas">0</span></div>
        </div>
      </div>
      <input type="text" id="filtro-lista" placeholder="Filtrar barra lateral..." oninput="poblarListaPalabras()" style="margin-bottom:8px;padding:7px 10px;font-size:13px;width:100%;box-sizing:border-box;">
      <select id="filtro-tipo" onchange="poblarListaPalabras()" style="margin-bottom:8px;padding:7px 10px;font-size:13px;width:100%;box-sizing:border-box;">
        <option value="todos">Todo (Verbos + Temas + Ejemplos)</option>
        <option value="verbos">Solo Verbos</option>
        <option value="temas">Solo Palabras y Temas</option>
        <option value="ejemplos">Solo Ejemplos sueltos</option>
      </select>
      <div id="lista-palabras" class="palabras-lista"></div>
      <div class="btn-row" style="margin-top:8px;">
        <button class="secondary btn-small" onclick="exportarBiblioteca()">💾 Exportar</button>
        <button class="secondary btn-small" onclick="document.getElementById('importar-json').click()">📂 Importar</button>
        <input type="file" id="importar-json" accept=".json" style="display:none;" onchange="importarBiblioteca(event)">
      </div>
      <div class="btn-row" style="margin-top:6px;">
        <button class="secondary btn-small" onclick="autoOrganizarConIA()">🧠 Auto-organizar sin tema</button>
        <button class="secondary btn-small" onclick="reforzarReferenciasCruzadasIA()">🔗 Reforzar referencias</button>
      </div>
    </div>

    <div class="contenido-principal">
      <div class="card">
    <div class="section-title">🔊 Decir una frase en inglés</div>
    <input type="text" id="frase" placeholder="Escribe una frase en inglés...">
    <div class="btn-row">
      <button onclick="hablarFrase()">▶ Escuchar frase</button>
      <button class="secondary" onclick="detenerVoz()">⏹ Detener</button>
    </div>
    <div class="muted">Usa la voz del navegador. No necesita internet.</div>
  </div>

  <div class="card">
    <div class="section-title">🔍 Buscar conjugaciones de un verbo</div>
    <input type="text" id="verbo" placeholder="Ejemplo: go, be, have, write...">
    <button onclick="buscarVerbo()">Buscar verbo</button>
    <div id="resultado" class="result"></div>
  </div>

  <div class="card">
    <div class="section-title">🤖 Estudiar con IA (Gemini)</div>
    <div class="grid-2">
      <input type="password" id="api-key" placeholder="Pega tu API Key de Google AI Studio (AIza...)">
      <input type="text" id="modelo-ia" value="gemini-2.5-flash" placeholder="Nombre del modelo">
    </div>
    <div class="btn-row">
      <button onclick="guardarApiKey()">💾 Guardar clave</button>
      <button class="secondary" onclick="probarConexionGemini()">🔌 Probar conexión</button>
    </div>
    <textarea id="prompt-ia" rows="3" placeholder="Ejemplos: 'Explícame el verbo go', 'Dame 5 frases con be', 'Corrige esta frase: I is happy'"></textarea>
    <div class="checkbox-group">
      <input type="checkbox" id="envioAutoIA" onchange="toggleEnvioAutoIA()">
      <label for="envioAutoIA">🔄 Enviar palabra a IA automáticamente al buscar/seleccionar</label>
    </div>
    <div class="checkbox-group">
      <input type="checkbox" id="hablarAutoIA" onchange="toggleHablarAutoIA()">
      <label for="hablarAutoIA">🔊 Hablar automáticamente después de responder</label>
    </div>
    <div style="margin:10px 0;padding:10px;background:#f8fafc;border-radius:8px;border:1px solid #e2e8f0;">
      <div style="font-size:13px;color:#1a3a6e;font-weight:600;margin-bottom:8px;">📁 Asignar a tema (opcional):</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <select id="tema-seleccionado" style="flex:1;padding:8px;border:1px solid #c9d4e6;border-radius:6px;font-size:13px;">
          <option value="">-- Sin tema --</option>
        </select>
        <input type="text" id="nuevo-tema" placeholder="Nombre nuevo tema" style="flex:1;padding:8px;border:1px solid #c9d4e6;border-radius:6px;font-size:13px;">
        <button onclick="crearTemaDesdeUI()" class="secondary" style="padding:8px 14px;font-size:13px;">➕ Crear</button>
      </div>
    </div>
    <div class="btn-row">
      <button onclick="enviarAGemini()">📤 Enviar a Gemini</button>
      <button onclick="anadirConIA()">✨ Añadir a biblioteca</button>
      <button class="secondary" onclick="limpiarIA()">🗑 Limpiar</button>
    </div>
    <div id="respuesta-ia" class="result" style="display:none;"></div>
    <div class="btn-row" style="margin-top:8px;">
      <button class="secondary" onclick="hablarFraseIA()">🔊 Escuchar respuesta de IA</button>
      <button class="secondary" onclick="detenerVoz()">⏹ Detener voz</button>
    </div>
  </div>
</div>
</div>

<script>
let vozActual = null;
let envioAutoIA = false;
let hablarAutoIA = false;

function toggleEnvioAutoIA() {
  const cb = document.getElementById('envioAutoIA');
  envioAutoIA = cb.checked;
  alert(envioAutoIA ? '✅ Envío automático a IA activado' : '❌ Envío automático a IA desactivado');
}

function toggleHablarAutoIA() {
  const cb = document.getElementById('hablarAutoIA');
  hablarAutoIA = cb.checked;
  alert(hablarAutoIA ? '✅ Hablar automáticamente activado' : '❌ Hablar automáticamente desactivado');
}

function hablarFrase() {
  const texto = document.getElementById('frase').value.trim();
  if (!texto) { alert('Escribe una frase primero.'); return; }
  detenerVoz();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = 'en-US';
  u.rate = 1;
  u.pitch = 1;
  vozActual = u;
  speechSynthesis.speak(u);
}

function detenerVoz() {
  speechSynthesis.cancel();
  vozActual = null;
}

function hablarFraseVerbo(texto) {
  detenerVoz();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = 'en-US';
  u.rate = 0.9;
  u.pitch = 1;
  vozActual = u;
  speechSynthesis.speak(u);
}

function buscarVerbo() {
  const input = document.getElementById('verbo').value.trim().toLowerCase();
  const res = document.getElementById('resultado');
  if (!input) {
    res.style.display = 'none';
    return;
  }
  const v = obtenerVerbo(input);
  if (!v) {
    res.style.display = 'block';
    res.innerHTML = '<h3>❌ Verbo no encontrado</h3><p>Intenta con la forma base (ejemplo: go, be, have).</p>';
    return;
  }
  const ex = obtenerEjemplo(input);
  const ejDefault = `I ${input.split('/')[0]} every day.`;
  let ejemplosHTML = '';
  if (ex) {
    const bloque = (etiqueta, item) => `<div class="example-label">${etiqueta}</div><div class="example-line"><div><span class="en">${item.en}</span> <span class="es">(${item.es})</span></div><button class="secondary btn-small" onclick="hablarFraseVerbo(this.dataset.en)" data-en="${item.en.replace(/"/g, '&quot;')}">🔊</button></div>`;
    ejemplosHTML = `<div class="example-block">${bloque('👤 Yo (1ª persona):', ex.pres1)}${bloque('👤 Él/Ella (3ª persona):', ex.pres3)}${bloque('⏳ Pasado:', ex.pas)}${bloque('🔗 Participio:', ex.pp)}${bloque('🔄 Gerundio (-ing):', ex.g)}</div>`;
  } else {
    ejemplosHTML = `<div class="example">Ejemplo: ${ejDefault}</div><button class="secondary btn-small" style="margin-top:8px;" onclick="hablarFraseVerbo(this.dataset.en)" data-en="${ejDefault.replace(/"/g, '&quot;')}">🔊 Escuchar ejemplo</button>`;
  }
  let botonEliminar = '';
  if (bibliotecaIA.verbos[input]) {
    botonEliminar = `<button class="secondary btn-small" style="margin-top:10px;" onclick="borrarDeBiblioteca('verbo', '${input.replace(/"/g, '&quot;')}')">🗑 Eliminar de biblioteca</button>`;
  }

  let seccionIA = '';
  const vb = bibliotecaIA.verbos[input] || {};
  if (vb.explicacionIA || vb.ejemplosIA) {
    const expandido = vb.expandidoIA ? '' : 'style="display:none"';
    const btnTexto = vb.expandidoIA ? '❌ Ocultar explicación de IA' : '✨ Ver explicación de IA';
    seccionIA = `
      <div style="margin-top:15px;padding:12px;background:#f0f7ff;border-radius:8px;border:1px solid #b3d9ff;">
        <button class="secondary btn-small" onclick="toggleExplicacionIA('${input.replace(/"/g, '&quot;')}')" style="margin-bottom:10px;width:100%;">${btnTexto}</button>
        <div id="explicacion-${input.replace(/"/g, '&quot;')}" ${expandido}>
          <div style="margin-bottom:8px;"><strong>📖 Explicación de IA:</strong></div>
          <div style="margin-bottom:8px;color:#334155;">${vb.explicacionIA || ''}</div>
          ${vb.ejemplosIA && vb.ejemplosIA.length > 0 ? `
            <div style="margin-top:8px;"><strong>📝 Ejemplos adicionales de IA:</strong></div>
            ${vb.ejemplosIA.map(ex => `<div class="example-line" style="margin-bottom:4px;"><div><span class="en">${ex.en}</span> <span class="es">(${ex.es})</span></div><button class="secondary btn-small" onclick="hablarFraseVerbo('${ex.en.replace(/"/g, '&quot;')}')">🔊</button></div>`).join('')}
          ` : ''}
        </div>
      </div>
    `;
  }

  res.style.display = 'block';
  res.innerHTML = `<h3>✅ ${input.charAt(0).toUpperCase() + input.slice(1)}</h3><div class="tag">Presente: ${v.p}</div><div class="tag">3ª persona: ${v.t3}</div><div class="tag">Pasado: ${v.pas}</div><div class="tag">Participio: ${v.pp}</div><div class="tag">Gerundio: ${v.g}</div><p class="traduccion">Español: ${v.es}</p>${ejemplosHTML}${seccionIA}${botonEliminar}`;

  if (envioAutoIA) {
    enviarPalabraAIA(input, v, ex);
  }
}

function enviarPalabraAIA(verbo, datosVerbales, ejemplos) {
  const ejemplosTexto = ejemplos
    ? `- ${ejemplos.pres1.en} (${ejemplos.pres1.es})\n- ${ejemplos.pres3.en} (${ejemplos.pres3.es})\n- ${ejemplos.pas.en} (${ejemplos.pas.es})\n- ${ejemplos.pp.en} (${ejemplos.pp.es})\n- ${ejemplos.g.en} (${ejemplos.g.es})`
    : '- No hay ejemplos disponibles.';

  const prompt = `Eres un tutor experto de inglés para hispanohablantes. El usuario está estudiando inglés y quiere comprender mejor el verbo "${verbo}" con todas sus conjugaciones y ejemplos. Responde SIEMPRE en español de forma clara, educativa y alentadora. Explica cada conjugación, su uso, y los ejemplos con traducción al español. Da consejos prácticos para usar correctamente este verbo en conversación. Contexto de estudio: el usuario está aprendiendo inglés como segundo idioma y esta es una de las palabras que está estudiando actualmente.

Verbo: ${verbo}
Presente: ${datosVerbales.p}
3ª persona: ${datosVerbales.t3}
Pasado: ${datosVerbales.pas}
Participio: ${datosVerbales.pp}
Gerundio: ${datosVerbales.g}
Traducción: ${datosVerbales.es}

Ejemplos de uso:
${ejemplosTexto}`;

  const textarea = document.getElementById('prompt-ia');
  textarea.value = prompt;
  enviarAGemini();
}

function crearTema(titulo, tipo = 'Tema') {
  const id = titulo.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_') || 'tema_' + Date.now();
  if (!bibliotecaIA.temas[id]) {
    bibliotecaIA.temas[id] = { titulo, tipo, palabras: [], explicacion: '', aprendida: false };
    guardarBiblioteca();
  }
  return id;
}

function agregarPalabraATema(claveVerbo, temaId) {
  if (!bibliotecaIA.temas[temaId]) return;
  if (!bibliotecaIA.temas[temaId].palabras.includes(claveVerbo)) {
    bibliotecaIA.temas[temaId].palabras.push(claveVerbo);
  }
  if (bibliotecaIA.verbos[claveVerbo]) {
    bibliotecaIA.verbos[claveVerbo].temaId = temaId;
  }
  guardarBiblioteca();
}

function quitarPalabraDeTema(claveVerbo) {
  if (bibliotecaIA.verbos[claveVerbo] && bibliotecaIA.verbos[claveVerbo].temaId) {
    const temaId = bibliotecaIA.verbos[claveVerbo].temaId;
    if (bibliotecaIA.temas[temaId]) {
      bibliotecaIA.temas[temaId].palabras = bibliotecaIA.temas[temaId].palabras.filter(p => p !== claveVerbo);
    }
    delete bibliotecaIA.verbos[claveVerbo].temaId;
    guardarBiblioteca();
  }
}

function asignarVerboATema(claveVerbo, temaId) {
  if (!temaId || temaId === '') {
    quitarPalabraDeTema(claveVerbo);
    return;
  }
  // Quitar de tema anterior si tenía
  if (bibliotecaIA.verbos[claveVerbo] && bibliotecaIA.verbos[claveVerbo].temaId) {
    quitarPalabraDeTema(claveVerbo);
  }
  if (bibliotecaIA.temas[temaId]) {
    if (!bibliotecaIA.temas[temaId].palabras.includes(claveVerbo)) {
      bibliotecaIA.temas[temaId].palabras.push(claveVerbo);
    }
  }
  if (!bibliotecaIA.verbos[claveVerbo]) bibliotecaIA.verbos[claveVerbo] = {};
  bibliotecaIA.verbos[claveVerbo].temaId = temaId;
  guardarBiblioteca();
  poblarListaPalabras();
}

function obtenerTemasConPalabras() {
  const resultado = [];
  for (const id in bibliotecaIA.temas) {
    const tema = bibliotecaIA.temas[id];
    const palabras = tema.palabras.map(p => ({
      clave: p,
      ...(bibliotecaIA.verbos[p] || {})
    })).filter(p => p.clave);
    resultado.push({ id, ...tema, palabras });
  }
  return resultado.sort((a, b) => a.titulo.localeCompare(b.titulo));
}

function extraerEjemplosDeRespuesta(texto) {
  const ejemplos = [];
  const lineas = texto.split('\n');
  for (const linea of lineas) {
    const l = linea.trim();
    if (l.length < 5) continue;
    if (l.includes('(') && l.includes(')') && (l.startsWith('-') || l.startsWith('•') || l.startsWith('*') || l.match(/^[A-Z]/))) {
      const match = l.match(/^(.+?)\s*\((.+?)\)\s*$/);
      if (match) {
        ejemplos.push({ en: match[1].trim(), es: match[2].trim() });
      } else if (l.includes('Ejemplo:') || l.includes('ejemplo:')) {
        const partes = l.split(/:|-/);
        if (partes.length >= 2) {
          ejemplos.push({ en: partes[1].trim(), es: partes[2]?.trim() || '' });
        }
      }
    }
  }
  return ejemplos.slice(0, 10);
}

function toggleExplicacionIA(clave) {
  if (!bibliotecaIA.verbos[clave]) return;
  bibliotecaIA.verbos[clave].expandidoIA = !bibliotecaIA.verbos[clave].expandidoIA;
  guardarBiblioteca();
  buscarVerbo();
}

let bibliotecaIA = { verbos: {}, ejemplos: {}, temas: {}, ejemplosSueltos: {} };
try {
  const g = localStorage.getItem('mi_biblioteca_ia');
  if (g) {
    const p = JSON.parse(g);
    bibliotecaIA = { verbos: p.verbos || {}, ejemplos: p.ejemplos || {}, temas: p.temas || {}, ejemplosSueltos: p.ejemplosSueltos || {} };
  }
} catch (e) {}

function guardarBiblioteca() {
  try { localStorage.setItem('mi_biblioteca_ia', JSON.stringify(bibliotecaIA)); } catch (e) {}
}

function obtenerVerbo(clave) {
  const base = VERBOS[clave];
  const custom = bibliotecaIA.verbos[clave];
  if (!base && !custom) return null;
  return { ...(base || {}), ...(custom || {}) };
}

function obtenerEjemplo(clave) {
  return bibliotecaIA.ejemplos[clave] || EJEMPLOS[clave] || null;
}

function actualizarStats() {
  const todosVerbos = { ...VERBOS, ...bibliotecaIA.verbos };
  const totalVerbos = Object.keys(todosVerbos).length;
  const totalTemas = Object.keys(bibliotecaIA.temas).length;
  const totalEjemplosSueltos = Object.keys(bibliotecaIA.ejemplosSueltos).length;
  let aprendidas = 0;
  for (const k in bibliotecaIA.verbos) if (bibliotecaIA.verbos[k].aprendida) aprendidas++;
  for (const k in bibliotecaIA.temas) if (bibliotecaIA.temas[k].aprendida) aprendidas++;
  for (const k in bibliotecaIA.ejemplosSueltos) if (bibliotecaIA.ejemplosSueltos[k].aprendida) aprendidas++;
  const total = totalVerbos + totalTemas + totalEjemplosSueltos;
  const nuevas = total - aprendidas;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-nuevas').textContent = nuevas;
  document.getElementById('stat-aprendidas').textContent = aprendidas;
}

function poblarListaPalabras() {
  const lista = document.getElementById('lista-palabras');
  if (!lista) return;
  const filtroTexto = (document.getElementById('filtro-lista')?.value || '').trim().toLowerCase();
  const filtroTipo = document.getElementById('filtro-tipo')?.value || 'todos';
  let html = '';
  let num = 0;

  if (filtroTipo === 'todos' || filtroTipo === 'temas') {
    const temas = obtenerTemasConPalabras();
    for (const tema of temas) {
      if (!tema.titulo.toLowerCase().includes(filtroTexto)) continue;
      const aprendida = tema.aprendida ? '✅' : '⬜';
      num++;
      html += `<div style="margin-bottom:12px;padding:10px;background:#f0f7ff;border-radius:8px;border:1px solid #b3d9ff;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-weight:bold;color:#1a3a6e;">${num}</span>
            <span class="aprendida-btn" onclick="event.stopPropagation(); toggleAprendidaTema('${tema.id.replace(/"/g,'&quot;')}')" title="Marcar como aprendida">${aprendida}</span>
            <strong>📁 ${tema.titulo}</strong>
            <span class="tag" style="font-size:11px;">${tema.tipo || 'Tema'} (${tema.palabras.length})</span>
          </div>
          <button class="secondary btn-small" style="padding:4px 10px;font-size:12px;" onclick="mostrarTema('${tema.id.replace(/"/g, '&quot;')}')">Ver</button>
        </div>
        ${tema.palabras.length > 0 ? `
          <div style="margin-left:20px;">
            ${tema.palabras.map((p, i) => {
              const esIA = bibliotecaIA.verbos[p.clave];
              const aprendidaPalabra = esIA && esIA.aprendida ? '✅' : '⬜';
              const marca = esIA ? '✨ ' : '';
              return `<div class="palabra-item" style="display:flex;align-items:center;gap:6px;padding:4px 8px;border-bottom:1px solid #e0e0e0;margin-bottom:4px;border-radius:4px;" onclick="seleccionarPalabra('${p.clave.replace(/"/g, '&quot;')}')">
                <span style="font-size:12px;color:#666;">${num + i + 1}</span>
                <span class="aprendida-btn" onclick="event.stopPropagation(); toggleAprendidaVerbo('${p.clave.replace(/"/g,'&quot;')}')" title="Marcar como aprendida">${aprendidaPalabra}</span>
                <div style="flex:1;">
                  <div class="palabra-nombre" style="font-size:13px;">${marca}${p.clave}</div>
                  <div class="palabra-trad" style="font-size:11px;color:#666;">${p.es || ''}</div>
                </div>
                <button class="palabra-escuchar" data-en="${p.clave.replace(/"/g, '&quot;')}" style="font-size:11px;padding:2px 6px;" onclick="event.stopPropagation(); hablarFraseVerbo(this.dataset.en)">🔊</button>
              </div>`;
            }).join('')}
          </div>
        ` : `<div style="margin-left:20px;color:#666;font-style:italic;font-size:12px;">Sin palabras asignadas</div>`}
      </div>`;
    }
  }
  if (filtroTipo === 'todos' || filtroTipo === 'verbos') {
    const todos = { ...VERBOS, ...bibliotecaIA.verbos };
    const claves = Object.keys(todos).sort();
    for (const clave of claves) {
      const v = todos[clave];
      if (!clave.toLowerCase().includes(filtroTexto) && !v.es.toLowerCase().includes(filtroTexto)) continue;
      num++;
      const esIA = bibliotecaIA.verbos[clave];
      const aprendida = esIA && esIA.aprendida ? '✅' : '⬜';
      const marca = esIA ? '✨ ' : '';
      const temaActual = v.temaId ? bibliotecaIA.temas[v.temaId]?.titulo : '';
      const temaInfo = temaActual ? ` (📁 ${temaActual})` : '';
      const esBiblioteca = bibliotecaIA.verbos[clave] ? true : false;
      const selectTema = esBiblioteca && !v.temaId
        ? `<select id="tema-${clave}" onchange="asignarVerboATema('${clave.replace(/"/g,'&quot;')}', this.value)" style="padding:2px 6px;font-size:11px;border:1px solid #c9d4e6;border-radius:4px;">
            <option value="">-- Sin tema --</option>
            ${Object.keys(bibliotecaIA.temas).map(id => `<option value="${id}">${bibliotecaIA.temas[id].titulo}</option>`).join('')}
          </select>`
        : '';
      html += `<div class="palabra-item" data-clave="${clave.replace(/"/g, '&quot;')}" onclick="seleccionarPalabra(this.dataset.clave)" style="display:flex;align-items:center;gap:6px;padding:6px;border-bottom:1px solid #eee;border-radius:6px;">
        <span style="font-weight:bold;color:#1a3a6e;">${num}</span>
        <span class="aprendida-btn" onclick="event.stopPropagation(); toggleAprendidaVerbo('${clave.replace(/"/g,'&quot;')}')" title="Marcar como aprendida">${aprendida}</span>
        <div style="flex:1;">
          <div class="palabra-nombre">${marca}${clave}</div>
          <div class="palabra-trad">${v.es}${temaInfo}</div>
        </div>
        ${selectTema}
        <button class="palabra-escuchar" data-en="${clave.replace(/"/g, '&quot;')}" onclick="event.stopPropagation(); hablarFraseVerbo(this.dataset.en)">🔊</button>
      </div>`;
    }
  }
  if (filtroTipo === 'todos' || filtroTipo === 'ejemplos') {
    const clavesEj = Object.keys(bibliotecaIA.ejemplosSueltos).sort();
    for (const id of clavesEj) {
      const e = bibliotecaIA.ejemplosSueltos[id];
      if (!e.titulo.toLowerCase().includes(filtroTexto) && !e.es.toLowerCase().includes(filtroTexto)) continue;
      num++;
      const aprendida = e.aprendida ? '✅' : '⬜';
      const voz = e.ejemploPrincipal || e.titulo;
      html += `<div class="palabra-item" data-id="${id.replace(/"/g, '&quot;')}" onclick="mostrarEjemploSuelto(this.dataset.id)" style="display:flex;align-items:center;gap:6px;padding:6px;border-bottom:1px solid #eee;border-radius:6px;">
        <span style="font-weight:bold;color:#1a3a6e;">${num}</span>
        <span class="aprendida-btn" onclick="event.stopPropagation(); toggleAprendidaEjemploSuelto('${id.replace(/"/g,'&quot;')}')" title="Marcar como aprendida">${aprendida}</span>
        <div style="flex:1;">
          <div class="palabra-nombre">📝 ${e.titulo}</div>
          <div class="palabra-trad">${e.es}</div>
        </div>
        <button class="palabra-escuchar" data-en="${voz.replace(/"/g, '&quot;')}" onclick="event.stopPropagation(); hablarFraseVerbo(this.dataset.en)">🔊</button>
      </div>`;
    }
  }
  lista.innerHTML = html || '<div class="muted">Sin resultados</div>';
  actualizarStats();
}

}

function borrarDeBiblioteca(tipo, clave) {
  if (tipo === 'verbo') {
    // Quitar de cualquier tema donde esté asignado
    if (bibliotecaIA.verbos[clave] && bibliotecaIA.verbos[clave].temaId) {
      const temaId = bibliotecaIA.verbos[clave].temaId;
      if (bibliotecaIA.temas[temaId]) {
        bibliotecaIA.temas[temaId].palabras = bibliotecaIA.temas[temaId].palabras.filter(p => p !== clave);
      }
    }
    delete bibliotecaIA.verbos[clave];
    delete bibliotecaIA.ejemplos[clave];
  } else if (tipo === 'tema') {
    delete bibliotecaIA.temas[clave];
  } else if (tipo === 'ejemploSuelto') {
    delete bibliotecaIA.ejemplosSueltos[clave];
  }
  guardarBiblioteca();
  poblarListaPalabras();
  document.getElementById('resultado').style.display = 'none';
}

function exportarBiblioteca() {
  const blob = new Blob([JSON.stringify(bibliotecaIA, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mi-biblioteca-ingles.json';
  a.click();
}

function importarBiblioteca(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      bibliotecaIA.verbos = { ...bibliotecaIA.verbos, ...(data.verbos || {}) };
      bibliotecaIA.ejemplos = { ...bibliotecaIA.ejemplos, ...(data.ejemplos || {}) };
      bibliotecaIA.temas = { ...bibliotecaIA.temas, ...(data.temas || {}) };
      guardarBiblioteca();
      poblarListaPalabras();
      alert('Biblioteca importada correctamente.');
    } catch (err) {
      alert('Archivo JSON no válido.');
    }
  };
  reader.readAsText(file);
}

async function anadirConIA() {
  const texto = document.getElementById('prompt-ia').value.trim();
  const res = document.getElementById('respuesta-ia');
  const modelo = document.getElementById('modelo-ia').value.trim() || 'gemini-2.5-flash';
  const key = obtenerClave();
  const temaSeleccionado = document.getElementById('tema-seleccionado')?.value || '';
  const nuevoTemaNombre = document.getElementById('nuevo-tema')?.value.trim() || '';
  if (!texto) { alert('Escribe qué verbos, palabras o temas quieres añadir (ej: "Añade los verbos travel y book, y un tema sobre in/on/at").'); return; }
  if (!key) { alert('Primero introduce tu API Key.'); return; }
  res.style.display = 'block';
  res.textContent = '⏳ Generando contenido y guardando en tu barra lateral...';
  const schema = {
    type: 'OBJECT',
    properties: {
      verbos: {
        type: 'ARRAY',
        items: {
          type: 'OBJECT',
          properties: {
            base: { type: 'STRING' },
            p: { type: 'STRING' },
            t3: { type: 'STRING' },
            pas: { type: 'STRING' },
            pp: { type: 'STRING' },
            g: { type: 'STRING' },
            es: { type: 'STRING' },
            pres1_en: { type: 'STRING' },
            pres1_es: { type: 'STRING' },
            pres3_en: { type: 'STRING' },
            pres3_es: { type: 'STRING' },
            pas_en: { type: 'STRING' },
            pas_es: { type: 'STRING' },
            pp_en: { type: 'STRING' },
            pp_es: { type: 'STRING' },
            g_en: { type: 'STRING' },
            g_es: { type: 'STRING' }
          },
          required: ['base','p','t3','pas','pp','g','es','pres1_en','pres1_es','pres3_en','pres3_es','pas_en','pas_es','pp_en','pp_es','g_en','g_es']
        }
      },
      temas: {
        type: 'ARRAY',
        items: {
          type: 'OBJECT',
          properties: {
            titulo: { type: 'STRING' },
            tipo: { type: 'STRING' },
            es: { type: 'STRING' },
            explicacion: { type: 'STRING' },
            ejemplos: {
              type: 'ARRAY',
              items: {
                type: 'OBJECT',
                properties: { en: { type: 'STRING' }, es: { type: 'STRING' } },
                required: ['en', 'es']
              }
            }
          },
          required: ['titulo','tipo','es','explicacion','ejemplos']
        }
      },
      ejemplosSueltos: {
        type: 'ARRAY',
        items: {
          type: 'OBJECT',
          properties: {
            titulo: { type: 'STRING' },
            tipo: { type: 'STRING' },
            es: { type: 'STRING' },
            explicacion: { type: 'STRING' },
            ejemploPrincipal: { type: 'STRING' },
            listaEjemplos: {
              type: 'ARRAY',
              items: {
                type: 'OBJECT',
                properties: { en: { type: 'STRING' }, es: { type: 'STRING' } },
                required: ['en', 'es']
              }
            }
          },
          required: ['titulo','tipo','es']
        }
      }
    },
    required: ['verbos','temas','ejemplosSueltos']
  };
  const instruccion = `Eres un profesor de inglés. Según la petición del usuario, genera:
1) Verbos en inglés (en 'verbos', usando 'base' en minúsculas, p, t3, pas, pp, g, traducción 'es' y los 5 pares de ejemplos pres1, pres3, pas, pp, g)
2) Vocabulario, expresiones o temas de gramática (en 'temas', con titulo claro, tipo 'Palabra' o 'Tema', resumen/traducción 'es', explicacion clara en español y ejemplos en inglés con traducción)
3) Ejemplos sueltos como tablas, listas de contracciones, pronombres, usos (en 'ejemplosSueltos', con titulo claro, tipo 'Ejemplo', es=traducción/resumen, explicacion, ejemploPrincipal=frase principal para escuchar, y listaEjemplos=array de pares {en, es}).
Petición: ${texto}`;
  try {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelo)}:generateContent?key=${encodeURIComponent(key)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: instruccion }] }], generationConfig: { responseMimeType: 'application/json', responseSchema: schema } })
    });
    const data = await r.json();
    if (!r.ok) {
      res.textContent = `❌ Error HTTP ${r.status}: ${data.error?.message || 'Error en la API.'}`;
      return;
    }
    const nuevo = JSON.parse(data.candidates?.[0]?.content?.parts?.[0]?.text || '{}');
    let contV = 0, contT = 0, contE = 0;
    for (const v of (nuevo.verbos || [])) {
      const k = v.base.trim().toLowerCase();
      if (!k) continue;
      // Si ya está en biblioteca con explicación, no volver a explicar
      if (bibliotecaIA.verbos[k] && bibliotecaIA.verbos[k].explicacionIA) {
        continue;
      }
      bibliotecaIA.verbos[k] = { p: v.p, t3: v.t3, pas: v.pas, pp: v.pp, g: v.g, es: v.es, aprendida: false };
      // Asignar tema si se seleccionó
      const temaId = temaSeleccionado || (nuevoTemaNombre ? crearTema(nuevoTemaNombre, 'Tema') : '');
      if (temaId) bibliotecaIA.verbos[k].temaId = temaId;
      bibliotecaIA.ejemplos[k] = { pres1: { en: v.pres1_en, es: v.pres1_es }, pres3: { en: v.pres3_en, es: v.pres3_es }, pas: { en: v.pas_en, es: v.pas_es }, pp: { en: v.pp_en, es: v.pp_es }, g: { en: v.g_en, es: v.g_es } };
      contV++;
    }
    // Si se escribió un nombre de nuevo tema pero no se seleccionó, crearlo
    let temaIdAsignado = temaSeleccionado;
    if (nuevoTemaNombre && !temaIdAsignado) {
      temaIdAsignado = crearTema(nuevoTemaNombre, 'Tema');
    }
    for (const t of (nuevo.temas || [])) {
      const id = t.titulo.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_');
      if (!id) continue;
      if (!bibliotecaIA.temas[id]) {
        bibliotecaIA.temas[id] = { ...t, aprendida: false, palabras: [] };
        contT++;
      }
    }
    for (const e of (nuevo.ejemplosSueltos || [])) {
      const id = e.titulo.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_');
      if (!id) continue;
      bibliotecaIA.ejemplosSueltos[id] = { ...e, aprendida: false };
      contE++;
    }
    guardarBiblioteca();
    poblarListaPalabras();
    document.getElementById('nuevo-tema').value = '';
    res.textContent = `✅ ¡Biblioteca actualizada! Se añadieron ${contV} verbo(s), ${contT} tema(s) y ${contE} ejemplo(s) suelto(s) a tu barra lateral (marcados con ✨).`;
  } catch (err) {
    res.textContent = `❌ Error al añadir: ${err.message}`;
  }
}

function crearTemaDesdeUI() {
  const nombre = document.getElementById('nuevo-tema')?.value.trim();
  if (!nombre) { alert('Escribe un nombre para el tema.'); return; }
  const id = crearTema(nombre, 'Tema');
  poblarSelectTemas();
  document.getElementById('nuevo-tema').value = '';
  document.getElementById('tema-seleccionado').value = id;
  alert(`Tema "${nombre}" creado.`);
}

function poblarSelectTemas() {
  const select = document.getElementById('tema-seleccionado');
  if (!select) return;
  const valorActual = select.value;
  select.innerHTML = '<option value="">-- Sin tema --</option>';
  for (const id in bibliotecaIA.temas) {
    const t = bibliotecaIA.temas[id];
    select.innerHTML += `<option value="${id}">${t.titulo}</option>`;
  }
  select.value = valorActual;
}

const VERBOS = {
  be: { p: 'am/is/are', t3: 'is', pas: 'was/were', pp: 'been', g: 'being', es: 'ser/estar' },
  have: { p: 'have/has', t3: 'has', pas: 'had', pp: 'had', g: 'having', es: 'tener' },
  do: { p: 'do/does', t3: 'does', pas: 'did', pp: 'done', g: 'doing', es: 'hacer' },
  say: { p: 'say/says', t3: 'says', pas: 'said', pp: 'said', g: 'saying', es: 'decir' },
  go: { p: 'go/goes', t3: 'goes', pas: 'went', pp: 'gone', g: 'going', es: 'ir' },
  get: { p: 'get/gets', t3: 'gets', pas: 'got', pp: 'got/gotten', g: 'getting', es: 'obtener/ponerse' },
  make: { p: 'make/makes', t3: 'makes', pas: 'made', pp: 'made', g: 'making', es: 'hacer/fabricar' },
  know: { p: 'know/knows', t3: 'knows', pas: 'knew', pp: 'known', g: 'knowing', es: 'saber/conocer' },
  think: { p: 'think/thinks', t3: 'thinks', pas: 'thought', pp: 'thought', g: 'thinking', es: 'pensar/creer' },
  take: { p: 'take/takes', t3: 'takes', pas: 'took', pp: 'taken', g: 'taking', es: 'tomar/llevar' },
  see: { p: 'see/sees', t3: 'sees', pas: 'saw', pp: 'seen', g: 'seeing', es: 'ver' },

function obtenerClave() {

}

function limpiarIA() {
  document.getElementById('prompt-ia').value = '';

  document.getElementById('respuesta-ia').textContent = '';
}

async function probarConexionGemini() {
  const key = obtenerClave();
  const res = document.getElementById('respuesta-ia');
  if (!key) { alert('Primero pega tu API Key de Google AI Studio (empieza por AIza...).'); return; }
  res.style.display = 'block';
  res.textContent = '⏳ Probando conexión con Gemini...';
  try {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
    const data = await r.json();
    if (!r.ok) {
      res.textContent = `❌ Error HTTP ${r.status}: ${data.error?.message || 'Clave inválida o sin permisos.'}`;
      return;
    }
    const modelos = (data.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => m.name.replace('models/', '')).slice(0, 10);
    res.textContent = '✅ ¡Conexión correcta! Modelos disponibles: ' + modelos.join(', ');
  } catch (err) {
    res.textContent = `❌ Error de red/CORS (${err.message}). Si abriste el HTML haciendo doble clic (file://), ábrelo con un servidor local (Live Server en VS Code o python -m http.server).`;
  }
}

function limpiarMarkdown(texto) {
  return texto
    .replace(/\*\*(.*?)\*\*/g, '$1')
    .replace(/__(.*?)__/g, '$1')
    .replace(/\*(.*?)\*/g, '$1')
    .replace(/_(.*?)_/g, '$1')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/^[\*\-\+]\s+/gm, '')
    .replace(/^\s*-\s+/gm, '')
    .replace(/[ \t]+$/gm, '')
    .trim();
}

async function enviarAGemini() {
  const texto = document.getElementById('prompt-ia').value.trim();
  const res = document.getElementById('respuesta-ia');
  const modelo = document.getElementById('modelo-ia').value.trim() || 'gemini-2.5-flash';
  const key = obtenerClave();
  if (!texto) { alert('Escribe algo para enviarle a Gemini.'); return; }
  if (!key) { alert('Primero introduce tu API Key de Google AI Studio.'); return; }
  res.style.display = 'block';
  res.textContent = '⏳ Esperando respuesta de Gemini...';
  const prompt = `Eres un tutor experto de inglés para hispanohablantes. El usuario está estudiando inglés y quiere comprender mejor el siguiente tema o palabra. Responde SIEMPRE en español de forma clara, educativa y alentadora. Explica el concepto, las conjugaciones (si aplica) y los ejemplos con su traducción al español. Da consejos prácticos para usar correctamente lo aprendido. Contexto: ${texto}`;
  try {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelo)}:generateContent?key=${encodeURIComponent(key)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
    });
    const data = await r.json();
    if (!r.ok) {
      res.textContent = `❌ Error HTTP ${r.status}: ${data.error?.message || 'Revisa tu API Key o el nombre del modelo.'}`;
      return;
    }
    const respuesta = data.candidates?.[0]?.content?.parts?.[0]?.text;
    const respuestaLimpia = limpiarMarkdown(respuesta) || '❌ No se obtuvo texto en la respuesta.';
    res.textContent = respuestaLimpia;
    
    
    if (hablarAutoIA) {
      hablarFraseIA();
    }
  } catch (err) {
    res.textContent = `❌ Error de conexión: ${err.message}. Prueba abrir el HTML mediante un servidor local (localhost).`;
  }
}

function hablarFraseIA() {
  const res = document.getElementById('respuesta-ia');
  const texto = (res.innerText || res.textContent || '').trim();
  if (!texto || texto.startsWith('⏳') || texto.startsWith('❌')) return;
  detenerVoz();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = 'es-ES';
  u.rate = 0.95;
  vozActual = u;
  speechSynthesis.speak(u);
}

function normalizarId(texto) {
  return String(texto || '')
    .trim()
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '_')
    .replace(/^_+|_+$/g, '') || ('item_' + Date.now());
}

function normalizarTextoComparacion(texto) {
  return String(texto || '')
    .trim()
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');
}

function escHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function limpiarArrayTemas(arr) {
  const res = [];
  for (const id of (Array.isArray(arr) ? arr : [])) {
    if (id && bibliotecaIA.temas[id] && !res.includes(id)) res.push(id);
  }
  return res;
}

function deduplicarEjemplos(lista) {
  const vistos = new Set();
  const out = [];
  for (const item of (Array.isArray(lista) ? lista : [])) {
    if (!item || !item.en || !item.es) continue;
    const en = String(item.en).trim();
    const es = String(item.es).trim();
    const ctx = String(item.ctx || item.contexto || '💬 Ejemplo de uso').trim();
    const key = en.toLowerCase();
    if (!en || !es || vistos.has(key)) continue;
    vistos.add(key);
    out.push({ ctx, en, es });
  }
  return out;
}

function crearOActualizarTema(titulo, datosExtra = {}) {
  const limpio = String(titulo || '').trim();
  if (!limpio) return '';
  const norm = normalizarTextoComparacion(limpio);

  for (const id in bibliotecaIA.temas) {
    if (normalizarTextoComparacion(bibliotecaIA.temas[id].titulo) === norm) {
      const actual = bibliotecaIA.temas[id];
      bibliotecaIA.temas[id] = {
        ...actual,
        tipo: datosExtra.tipo || actual.tipo || 'Tema',
        es: datosExtra.es || actual.es || '',
        explicacion: datosExtra.explicacion || actual.explicacion || '',
        ejemplos: deduplicarEjemplos([...(actual.ejemplos || []), ...(datosExtra.ejemplos || [])]),
        titulo: actual.titulo
      };
      return id;
    }
  }

  const id = normalizarId(limpio);
  bibliotecaIA.temas[id] = {
    titulo: limpio,
    tipo: datosExtra.tipo || 'Tema',
    es: datosExtra.es || '',
    explicacion: datosExtra.explicacion || '',
    ejemplos: deduplicarEjemplos(datosExtra.ejemplos || []),
    aprendida: false
  };
  return id;
}

function quitarDeTema(tipoItem, id, temaId) {
  if (tipoItem === 'verbo') {
    const cur = bibliotecaIA.verbos[id] || {};
    const arr = limpiarArrayTemas(cur.temaIds).filter(t => t !== temaId);
    bibliotecaIA.verbos[id] = { ...cur, temaIds: arr };
    if (arr.length === 0) bibliotecaIA.verbos[id]._sinTemaManual = true;
  } else if (tipoItem === 'palabra' && bibliotecaIA.palabras[id]) {
    const arr = limpiarArrayTemas(bibliotecaIA.palabras[id].temaIds).filter(t => t !== temaId);
    bibliotecaIA.palabras[id].temaIds = arr;
    if (arr.length === 0) bibliotecaIA.palabras[id]._sinTemaManual = true;
  } else if (tipoItem === 'ejemplo' && bibliotecaIA.ejemplosSueltos[id]) {
    const arr = limpiarArrayTemas(bibliotecaIA.ejemplosSueltos[id].temaIds).filter(t => t !== temaId);
    bibliotecaIA.ejemplosSueltos[id].temaIds = arr;
    if (arr.length === 0) bibliotecaIA.ejemplosSueltos[id]._sinTemaManual = true;
  }
  guardarBiblioteca();
  poblarListaPalabras();
  refrescarVistaActual(tipoItem, id);
}

function refrescarVistaActual(tipoItem, id) {
  if (tipoItem === 'verbo') mostrarVerbo(id, false);
  else if (tipoItem === 'palabra') mostrarPalabraSuelta(id);
  else if (tipoItem === 'ejemplo') mostrarEjemploSuelto(id);
}

function obtenerTodosLosItems() {
  const items = [];
  const clavesVerbos = new Set([...Object.keys(VERBOS), ...Object.keys(bibliotecaIA.verbos)]);
  for (const k of clavesVerbos) {
    const v = obtenerVerbo(k);
    if (!v) continue;
    items.push({
      tipoItem: 'verbo',
      id: k,
      titulo: k,
      sub: v.es || '',
      temaIds: v.temaIds,
      aprendida: !!v.aprendida,
      esIA: !VERBOS[k] || !!v.notaProfesional || (v.ejemplosExtra && v.ejemplosExtra.length > 0),
      speak: k
    });
  }
  for (const id in bibliotecaIA.palabras) {
    const p = bibliotecaIA.palabras[id];
    items.push({
      tipoItem: 'palabra',
      id,
      titulo: p.palabra,
      sub: (p.categoria ? '[' + p.categoria + '] ' : '') + (p.es || ''),
      temaIds: limpiarArrayTemas(p.temaIds),
      aprendida: !!p.aprendida,
      esIA: true,
      speak: p.palabra
    });
  }
  for (const id in bibliotecaIA.ejemplosSueltos) {
    const e = bibliotecaIA.ejemplosSueltos[id];
    items.push({
      tipoItem: 'ejemplo',
      id,
      titulo: e.titulo || e.en || id,
      sub: e.es || '',
      temaIds: limpiarArrayTemas(e.temaIds),
      aprendida: !!e.aprendida,
      esIA: true,
      speak: e.ejemploPrincipal || e.en || e.titulo
    });
  }
  return items;
}

function obtenerElementosDeTema(temaId) {
  return obtenerTodosLosItems().filter(item => item.temaIds.includes(temaId))
    .sort((a, b) => a.titulo.localeCompare(b.titulo));
}

function mostrarPalabraSuelta(id) {
  const p = bibliotecaIA.palabras[id];
  const res = document.getElementById('resultado');
  if (!p || !res) return;

  const temaIds = limpiarArrayTemas(p.temaIds);
  const ejemplos = deduplicarEjemplos(p.ejemplos || []);
  const filasEjemplos = ejemplos.length

function borrarEjemploExtra(tipoItem, id, index) {
  if (tipoItem === 'verbo' && bibliotecaIA.verbos[id]?.ejemplosExtra) {
    bibliotecaIA.verbos[id].ejemplosExtra.splice(index, 1);
  } else if (tipoItem === 'palabra' && bibliotecaIA.palabras[id]?.ejemplos) {
    bibliotecaIA.palabras[id].ejemplos.splice(index, 1);
  } else if (tipoItem === 'ejemplo' && bibliotecaIA.ejemplosSueltos[id]?.listaEjemplos) {
    bibliotecaIA.ejemplosSueltos[id].listaEjemplos.splice(index, 1);
  }
  guardarBiblioteca();
  refrescarVistaActual(tipoItem, id);
}

async function llamarGemini(contentsPrompt, generationConfig = null) {
  const modelo = document.getElementById('modelo-ia').value.trim() || 'gemini-2.5-flash';
  const key = obtenerClave();
  if (!key) throw new Error('Falta tu API Key de Google AI Studio.');

  const body = { contents: [{ parts: [{ text: contentsPrompt }] }] };
  if (generationConfig) body.generationConfig = generationConfig;

  const r = await fetch(
    'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(modelo) + ':generateContent?key=' + encodeURIComponent(key),
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
  );
  const data = await r.json();
  if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + (data.error?.message || 'Error en la API.'));
  return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
}

function resolverTemasDesdeTitulos(titulosArray, opcionManual = '') {
  const selTema = document.getElementById('tema-seleccionado')?.value || '';
  const nuevoManual = document.getElementById('nuevo-tema')?.value.trim() || '';

  if (opcionManual === '__none__' || selTema === '__none__') return [];

  const resultadoIds = [];
  if (nuevoManual) {
    const id = crearOActualizarTema(nuevoManual, { tipo: 'Tema' });
    if (id && !resultadoIds.includes(id)) resultadoIds.push(id);
  } else if (selTema && selTema !== '__none__' && bibliotecaIA.temas[selTema]) {
    resultadoIds.push(selTema);
  }

  for (const t of (Array.isArray(titulosArray) ? titulosArray : [])) {
    const limpio = String(t || '').trim();
    if (!limpio) continue;
    const id = crearOActualizarTema(limpio, { tipo: 'Tema' });
    if (id && !resultadoIds.includes(id)) resultadoIds.push(id);
  }
  return resultadoIds;
}

async function explicarVerboConIA(clave) {

  const res = document.getElementById('respuesta-ia');
  res.style.display = 'block';
  res.textContent = '⏳ Generando nota profesional, ejemplos contextuales y referencias cruzadas para "' + clave + '"...';

  const temasActuales = Object.values(bibliotecaIA.temas).map(function(t) { return t.titulo; });
  const schema = {
    type: 'OBJECT',
    properties: {
      notaProfesional: { type: 'STRING' },
      temasTitulos: { type: 'ARRAY', items: { type: 'STRING' } },
      ejemplos: {
        type: 'ARRAY',
        items: {
          type: 'OBJECT',
          properties: {
            contexto: { type: 'STRING' },
            en: { type: 'STRING' },
            es: { type: 'STRING' }
          },
          required: ['contexto', 'en', 'es']
        }
      }
    },

  };

  const prompt = 'Eres un lexicógrafo y profesor de inglés para hispanohablantes.\nAnaliza el verbo "' + clave + '" (' + v.es + '; conjugaciones: ' + v.p + ' / ' + v.t3 + ' / ' + v.pas + ' / ' + v.pp + ' / ' + v.g + ').\n\n1) "notaProfesional": Redacta una explicación CONCISE, profesional y práctica en español (3 a 5 líneas máximo, SIN saludos ni tono conversacional) que resuma matices clave de significado, errores frecuentes de hispanohablantes y preposiciones o estructuras habituales.\n2) "ejemplos": Genera entre 5 y 8 ejemplos variados y de uso real (distintos significados, negación, pregunta, colocaciones o phrasal verbs clave, voz pasiva/condicional si aplica). Para CADA ejemplo, escribe en "contexto" un encabezado breve y claro con emoji que explique POR QUÉ o CÓMO se usa ese ejemplo.\n3) "temasTitulos": Asigna entre 2 y 3 temas para referencias cruzadas (por uso/contexto Y por gramática). Reutiliza estos temas si encajan: ' + temasActuales.join(', ') + '.';

  try {
    const raw = await llamarGemini(prompt, { responseMimeType: 'application/json', responseSchema: schema });

    const nuevosEjemplos = (data.ejemplos || []).map(function(e) {
      return { ctx: e.contexto, en: e.en, es: e.es };
    });

    const cur = bibliotecaIA.verbos[clave] || {};

      ...cur,
      ...(VERBOS[clave] ? {} : v),
      notaProfesional: String(data.notaProfesional || '').trim(),
      ejemplosExtra: deduplicarEjemplos([...(cur.ejemplosExtra || []), ...nuevosEjemplos]),

    guardarBiblioteca();
    poblarSelectTemas();
    poblarListaPalabras();

  }
}

      bibliotecaIA.verbos[k] = ficha;
      contV++;
    }

    for (const p of (nuevo.palabras || [])) {

      const id = normalizarId(palabra);

        palabra: palabra,
        categoria: p.categoria || cur.categoria || 'Vocabulario',

        nota: String(p.notaProfesional || cur.nota || '').trim(),
        ejemplos: deduplicarEjemplos([...(cur.ejemplos || []), ...nuevosEjemplos]),
        temaIds: idsFinales,
        aprendida: cur.aprendida || false
      };
      if (idsFinales.length === 0 && selTema === '__none__') bibliotecaIA.palabras[id]._sinTemaManual = true;
      contP++;
    }

    for (const e of (nuevo.ejemplosSueltos || [])) {
      const titulo = String(e.titulo || e.ejemploPrincipal || '').trim();
      if (!titulo) continue;
      const id = normalizarId(titulo);
      const cur = bibliotecaIA.ejemplosSueltos[id] || {};
      const nuevosIds = selTema === '__none__' ? [] : resolverTemasDesdeTitulos(e.temasTitulos);
      const idsFinales = selTema === '__none__' ? [] : [...new Set([...limpiarArrayTemas(cur.temaIds), ...nuevosIds])];
      const lista = (e.listaEjemplos || []).map(function(item) { return { ctx: item.contexto, en: item.en, es: item.es }; });

      bibliotecaIA.ejemplosSueltos[id] = {
        titulo: titulo,
        tipo: e.tipo || cur.tipo || 'Ejemplo',
        es: e.es || cur.es || '',
        explicacion: String(e.explicacion || cur.explicacion || '').trim(),
        ejemploPrincipal: e.ejemploPrincipal || cur.ejemploPrincipal || '',
        ctxPrincipal: e.ctxPrincipal || cur.ctxPrincipal || '💬 Expresión principal',
        listaEjemplos: deduplicarEjemplos([...(cur.listaEjemplos || []), ...lista]),
        temaIds: idsFinales,
        aprendida: cur.aprendida || false
      };
      contE++;
    }

    guardarBiblioteca();
    poblarSelectTemas();
    poblarListaPalabras();
    res.textContent = '✅ ¡Biblioteca actualizada! Se añadieron ' + contV + ' verbo(s), ' + contT + ' tema(s) y ' + contE + ' ejemplo(s) suelto(s) a tu barra lateral (marcados con ✨).';
  } catch (err) {
    res.textContent = '❌ Error al añadir: ' + err.message;
  }
}

    'Extrae y estructura TODO el contenido educativo útil de esta consulta y respuesta, SIN guardar la conversación ni saludos. Sintetiza notas concisas y profesionales, y extrae TODOS los ejemplos mencionados (o complétalos si falta traducción), cada uno con su encabezado "contexto" explicando por qué o cómo se usa.\n\nConsulta del usuario: ' + consulta + '\n\nRespuesta obtenida:\n' + textoChat,
    '⏳ Extrayendo explicación concisa, todos los ejemplos contextuales y temas cruzados...'
  );
}

function inicializarTemasBaseYReferencias() {
  const mapaTituloAId = {};
  for (const titulo in DEFAULT_TEMAS_META) {
    const meta = DEFAULT_TEMAS_META[titulo];
    mapaTituloAId[titulo] = crearOActualizarTema(titulo, { tipo: meta.tipo, es: meta.es });
  }

  for (const k in VERBOS) {
    const custom = bibliotecaIA.verbos[k] || {};
    const actuales = limpiarArrayTemas(custom.temaIds);
    if (actuales.length === 0 && !custom._sinTemaManual) {
      const defaults = (DEFAULT_VERB_THEMES[k] || [0]).map(i => BASE_THEME_NAMES[i]).map(t => mapaTituloAId[t]).filter(Boolean);
      bibliotecaIA.verbos[k] = { ...custom, temaIds: defaults };
    } else if (bibliotecaIA.verbos[k]) {
      bibliotecaIA.verbos[k].temaIds = actuales;
    }
  }
}

function autoOrganizarConIA() {
  const res = document.getElementById('respuesta-ia');
  const itemsSinTema = obtenerTodosLosItems().filter(item => item.temaIds.length === 0);
  if (itemsSinTema.length === 0) {
    res.style.display = 'block';
    res.textContent = '✅ Todos los elementos ya tienen tema asignado.';
    return;
  }
  res.style.display = 'block';
  res.textContent = '⏳ Organizando automáticamente ' + itemsSinTema.length + ' elementos sin tema...';

  const temasExistentes = Object.values(bibliotecaIA.temas).map(t => t.titulo);
  const schema = {
    type: 'OBJECT',
    properties: {
      asignaciones: {
        type: 'ARRAY',
        items: {
          type: 'OBJECT',
          properties: {
            verbo: { type: 'STRING' },
            tema: { type: 'STRING' },
            razon: { type: 'STRING' }
          },
          required: ['verbo', 'tema', 'razon']
        }
      }
    },
    required: ['asignaciones']
  };

  const verbosSinTema = itemsSinTema.filter(i => i.tipoItem === 'verbo').map(i => i.titulo);
  const prompt = 'Eres un organizador de vocabulario de inglés. Tengo estos verbos sin tema: ' + verbosSinTema.join(', ') + '.\nTemas disponibles: ' + temasExistentes.join(', ') + '.\nAsigna cada verbo al tema más apropiado. Si no encaja en ninguno, crea un tema nuevo breve en español. Devuelve JSON con "asignaciones": [{verbo, tema, razon}].';

  llamarGemini(prompt, { responseMimeType: 'application/json', responseSchema: schema }).then(raw => {
    try {
      const data = JSON.parse(raw || '{}');
      for (const a of (data.asignaciones || [])) {
        const k = a.verbo.trim().toLowerCase();
        if (bibliotecaIA.verbos[k]) {
          const temaId = crearOActualizarTema(a.tema, { tipo: 'Tema' });
          if (!bibliotecaIA.verbos[k].temaIds) bibliotecaIA.verbos[k].temaIds = [];
          if (!bibliotecaIA.verbos[k].temaIds.includes(temaId)) {
            bibliotecaIA.verbos[k].temaIds.push(temaId);
          }
        }
      }
      guardarBiblioteca();
      poblarSelectTemas();
      poblarListaPalabras();
      res.textContent = '✅ Se organizaron ' + (data.asignaciones || []).length + ' verbos en temas.';
    } catch (err) {
      res.textContent = '❌ Error al organizar: ' + err.message;
    }
  }).catch(err => {
    res.textContent = '❌ Error de conexión: ' + err.message;
  });
}

function reforzarReferenciasCruzadasIA() {
  const res = document.getElementById('respuesta-ia');
  const items = obtenerTodosLosItems();
  const conUnSoloTema = items.filter(i => i.temaIds.length === 1);
  if (conUnSoloTema.length === 0) {
    res.style.display = 'block';
    res.textContent = '✅ Todos los elementos ya tienen múltiples temas o no necesitan más.';
    return;
  }
  res.style.display = 'block';
  res.textContent = '⏳ Buscando referencias cruzadas para ' + conUnSoloTema.length + ' elementos...';

  const temasExistentes = Object.values(bibliotecaIA.temas).map(t => t.titulo);
  const schema = {
    type: 'OBJECT',
    properties: {
      sugerencias: {
        type: 'ARRAY',
        items: {
          type: 'OBJECT',
          properties: {
            verbo: { type: 'STRING' },
            temaSugerido: { type: 'STRING' },
            razon: { type: 'STRING' }
          },
          required: ['verbo', 'temaSugerido', 'razon']
        }
      }
    },
    required: ['sugerencias']
  };

  const verbos = conUnSoloTema.filter(i => i.tipoItem === 'verbo').map(i => i.titulo);
  const prompt = 'Tengo estos verbos con un solo tema: ' + verbos.join(', ') + '.\nTemas existentes: ' + temasExistentes.join(', ') + '.\nSugiere temas adicionales (referencias cruzadas) para cada verbo según su significado y uso. Devuelve JSON con "sugerencias": [{verbo, temaSugerido, razon}].';

  llamarGemini(prompt, { responseMimeType: 'application/json', responseSchema: schema }).then(raw => {
    try {
      const data = JSON.parse(raw || '{}');
      let count = 0;
      for (const s of (data.sugerencias || [])) {
        const k = s.verbo.trim().toLowerCase();
        if (bibliotecaIA.verbos[k]) {
          const temaId = crearOActualizarTema(s.temaSugerido, { tipo: 'Tema' });
          if (!bibliotecaIA.verbos[k].temaIds) bibliotecaIA.verbos[k].temaIds = [];
          if (!bibliotecaIA.verbos[k].temaIds.includes(temaId)) {
            bibliotecaIA.verbos[k].temaIds.push(temaId);
            count++;
          }
        }
      }
      guardarBiblioteca();
      poblarSelectTemas();
      poblarListaPalabras();
      res.textContent = '✅ Se agregaron ' + count + ' referencias cruzadas.';
    } catch (err) {
      res.textContent = '❌ Error al procesar: ' + err.message;
    }
  }).catch(err => {
    res.textContent = '❌ Error de conexión: ' + err.message;
  });
}

function alternarTodosTemas() {
  const ids = Object.keys(bibliotecaIA.temas);
  const algunoAbierto = ids.some(id => temasExpandidos[id]);
  for (const id of ids) temasExpandidos[id] = !algunoAbierto;
  poblarListaPalabras();
}

function limpiarExtrasVerbo(clave) {
  if (!bibliotecaIA.verbos[clave]) return;
  delete bibliotecaIA.verbos[clave].notaProfesional;
  delete bibliotecaIA.verbos[clave].ejemplosExtra;
  guardarBiblioteca();
  poblarListaPalabras();
  mostrarVerbo(clave, false);
}

function toggleAprendida(tipoItem, id) {
  if (tipoItem === 'tema' && bibliotecaIA.temas[id]) {
    bibliotecaIA.temas[id].aprendida = !bibliotecaIA.temas[id].aprendida;
  } else if (tipoItem === 'verbo') {
    const v = obtenerVerbo(id);
    if (!v) return;
    bibliotecaIA.verbos[id] = { ...(bibliotecaIA.verbos[id] || {}), temaIds: v.temaIds, aprendida: !v.aprendida };
  } else if (tipoItem === 'palabra' && bibliotecaIA.palabras[id]) {
    bibliotecaIA.palabras[id].aprendida = !bibliotecaIA.palabras[id].aprendida;
  } else if (tipoItem === 'ejemplo' && bibliotecaIA.ejemplosSueltos[id]) {
    bibliotecaIA.ejemplosSueltos[id].aprendida = !bibliotecaIA.ejemplosSueltos[id].aprendida;
  }
  guardarBiblioteca();
  poblarListaPalabras();
}
